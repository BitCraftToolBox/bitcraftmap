<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="description" content="Game map for BitCraft Online" />
		<!-- STDB sdk requires unsafe-eval which makes the entire CSP a little bit silly anyway cwl/stdb #4966 -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self';
					 script-src 'self' 'unsafe-eval' 'unsafe-inline' https://static.cloudflareinsights.com;
					 style-src 'self' 'unsafe-inline';
					 img-src 'self' https://prism.brico.app data:;
					 connect-src 'self' wss://st.prism.brico.app https://st.prism.brico.app https://prism.brico.app https://api.github.com https://gist.githubusercontent.com https://cloudflareinsights.com;
					 font-src 'self';"
		/>
		<link rel="icon" href="/favicon.svg" />
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
